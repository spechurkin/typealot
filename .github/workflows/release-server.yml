name: Release synchronization server
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
concurrency:
  group: release-server
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/release/release-guard.mjs server validate
      - run: npm ci
      - run: npm run release:server
      - run: node scripts/release/release-guard.mjs server publish
        id: release_guard
      - name: Publish numbered release
        if: steps.release_guard.outputs.publish != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish-release.mjs server
